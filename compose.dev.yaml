# Local test mailbox, so you can try the whole flow without a real account:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Then add an IMAP account in the UI:
#   host: greenmail   port: 3143   security: None
#   username: me@example.test   password: anything (GreenMail accepts any)
#
# Send test mail to it over SMTP on localhost:3025, e.g.:
#   python -c "import smtplib; s=smtplib.SMTP('localhost',3025); s.sendmail('shop@example.test',['me@example.test'],'Subject: Your receipt\n\nTotal: 12.00 EUR'); s.quit()"

services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
    ports:
      - "3025:3025"
      - "3143:3143"
    restart: unless-stopped
